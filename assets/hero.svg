<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-label="Terminal: whoami, aniket mishra, building Blink">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="62" height="28" width="0"><animate attributeName="width" from="0" to="120" dur="0.5s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" height="28" width="0"><animate attributeName="width" from="0" to="480" dur="1.2s" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="132" height="28" width="0"><animate attributeName="width" from="0" to="170" dur="0.6s" begin="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="162" height="28" width="0"><animate attributeName="width" from="0" to="790" dur="2.2s" begin="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="202" height="28" width="0"><animate attributeName="width" from="0" to="120" dur="0.4s" begin="6.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="2" y="2" width="856" height="276" rx="14" fill="url(#glow)"/>
  <rect x="6" y="6" width="848" height="268" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M6 44 H854" stroke="#30363d"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="25" r="6" fill="#27c93f"/>
  <text x="430" y="30" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#8b949e">aniket@blink ~</text>

  <g font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="18">
    <g clip-path="url(#c1)"><text x="40" y="82"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text></g>
    <g clip-path="url(#c2)"><text x="40" y="112" fill="#58a6ff">aniket mishra · final-year CS @ SRM IST</text></g>
    <g clip-path="url(#c3)"><text x="40" y="152"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> cat now.txt</tspan></text></g>
    <g clip-path="url(#c4)"><text x="40" y="182" fill="#bc8cff">building Blink: predict GPU latency &amp; VRAM before you run the model</text></g>
    <g clip-path="url(#c5)"><text x="40" y="222"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> pip install blink-gpu</tspan></text></g>
    <rect x="40" y="240" width="11" height="3" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
