<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Blink: predict how fast your model runs on a GPU, before you run it">
  <style>
    .bg { fill: #0b0b0c; }
    .card { fill: none; stroke: #27272a; stroke-width: 1; }
    .title { fill: #f4f4f5; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 600; letter-spacing: -0.5px; }
    .sub { fill: #a1a1aa; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; }
    .stat { fill: #F75C7E; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 600; }
    .stat-label { fill: #71717a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
    .pill { fill: #18181b; stroke: #27272a; stroke-width: 1; }
    .code { fill: #d4d4d8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .fade { opacity: 0; animation: fade 1s ease-out forwards; }
    .f1 { animation-delay: 0.1s; }
    .f2 { animation-delay: 0.4s; }
    .f3 { animation-delay: 0.7s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <rect class="bg" width="860" height="260" rx="12"/>
  <rect class="card" x="0.5" y="0.5" width="859" height="259" rx="12"/>

  <g class="fade f1">
    <text class="title" x="48" y="82">Blink</text>
    <text class="sub" x="48" y="116">Know how fast your model will run on a GPU, before you run it.</text>
  </g>

  <g class="fade f2">
    <text class="stat" x="48" y="194">2,000+</text>
    <text class="stat-label" x="48" y="218">Downloads</text>
  </g>

  <g class="fade f3">
    <rect class="pill" x="560" y="166" width="252" height="44" rx="22"/>
    <text class="code" x="586" y="194">pip install blink-gpu</text>
  </g>
</svg>
