<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Aniket Mishra: Full Stack Developer, Web3 and AI Explorer">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
    .win { fill: #0d1117; stroke: #27272a; stroke-width: 1; }
    .bar { fill: #111316; }
    .title { fill: #52525b; font-size: 12px; }
    .prompt { fill: #71717a; font-size: 16px; }
    .cmd { fill: #d4d4d8; font-size: 16px; }
    .name { fill: #f4f4f5; font-size: 34px; font-weight: 600; letter-spacing: -0.5px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .role { fill: #a1a1aa; font-size: 16px; }
    .accent { fill: #F75C7E; }
    .dot { fill: #27272a; }
    .out { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .o1 { animation-delay: 1.2s; }
    .o2 { animation-delay: 4.2s; }
    .k1 { animation: type1 0.8s steps(23, end) 0.3s forwards; }
    .k2 { animation: type2 0.9s steps(29, end) 1.6s forwards; }
    .k3 { animation: type3 1.6s steps(41, end) 2.5s forwards; }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes type1 { from { width: 0; } to { width: 221px; } }
    @keyframes type2 { from { width: 0; } to { width: 278px; } }
    @keyframes type3 { from { width: 0; } to { width: 394px; } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
      .caret { display: none; }
    }
  </style>

  <rect class="win" x="0.5" y="0.5" width="859" height="249" rx="12"/>
  <path class="bar" d="M12.5 0.5 H847.5 A12 12 0 0 1 859.5 12.5 V34 H0.5 V12.5 A12 12 0 0 1 12.5 0.5 Z"/>
  <line x1="0" y1="34.5" x2="860" y2="34.5" stroke="#27272a"/>
  <circle class="dot" cx="24" cy="17.5" r="5"/>
  <circle class="dot" cx="40" cy="17.5" r="5"/>
  <circle class="dot" cx="56" cy="17.5" r="5"/>
  <text class="title" x="430" y="21.5" text-anchor="middle">aniket — zsh</text>

  <defs>
    <clipPath id="c1"><rect class="k1" x="48" y="50" width="0" height="22"/></clipPath>
    <clipPath id="c2"><rect class="k2" x="48" y="128" width="0" height="22"/></clipPath>
    <clipPath id="c3"><rect class="k3" x="48" y="158" width="0" height="20"/></clipPath>
  </defs>

  <g clip-path="url(#c1)">
    <text class="cmd" x="48" y="66"><tspan class="prompt">aniket@github:~$ </tspan>whoami</text>
  </g>
  <g class="out o1">
    <text class="name" x="48" y="106">Aniket Mishra</text>
  </g>

  <g clip-path="url(#c2)">
    <text class="cmd" x="48" y="144"><tspan class="prompt">aniket@github:~$ </tspan>cat role.txt</text>
  </g>
  <g clip-path="url(#c3)">
    <text class="role" x="48" y="172">Full Stack Developer · Web3 &amp; AI Explorer</text>
  </g>

  <text class="prompt" x="48" y="214">aniket@github:~$ </text>
  <rect class="accent caret" x="211" y="200" width="9" height="18"/>
</svg>
